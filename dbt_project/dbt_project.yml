name: datasense_dbt
version: '1.0.0'
config-version: 2

profile: datasense_dbt

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  datasense_dbt:
    bronze:
      +schema: PUBLIC_BRONZE
      +materialized: view
    silver:
      +schema: PUBLIC_SILVER
      +materialized: table
    gold:
      +schema: PUBLIC_GOLD
      +materialized: table
